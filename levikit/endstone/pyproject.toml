[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "endstone-levikit"
version = "0.1.0"
description = "LeviKit for Endstone"
requires-python = ">=3.10"
dependencies = []

[project.entry-points."endstone"]
levikit = "endstone_levikit:Levikit"

[tool.hatch.build.targets.wheel]
packages = ["src/endstone_levikit"]
