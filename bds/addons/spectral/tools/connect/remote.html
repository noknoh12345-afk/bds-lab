<!doctype html>
<html lang="ja" data-geoui-ore>
<head>
<meta charset="utf-8">
<title>Spectral Remote</title>
<!-- Spectral Player's remote in the game: this page made a GeoUI (node bds/geoui/html/convert.mjs … --ore: the lab's OreUI —
     panel/'s colours, pixel letters and pressables — under this page's own CSS). No form: the head's turns are the mouse, W A S D the
     arrows, jump presses, sneak goes back. Its buttons send `scriptevent spectral:remote <verb>` (nothing breaks without the
     player), the song's place comes back from Spectral Player each second (sr:value sec / len / pos, sr:show playing / paused),
     and 「つなぐ」 talks to Spectral Connect (tools/connect/server.mjs, the game's /connect): the URL typed with /sr:t <URL> goes
     to it as a mail (mail:play — tags it reads with /tag @s list), and its steps come back as sr:show st_* and sr:value sent. -->
<style>
  :root { --fs: 24px; --fs-s: 16px; --fs-l: 32px; }
  html, body { margin: 0; width: 1280px; height: 720px; overflow: hidden; }
  body { font-size: var(--fs); }
  header { position: absolute; left: 32px; right: 32px; top: 24px; height: 72px; display: flex; align-items: center; gap: 16px; }
  header h1 { margin: 0 16px 0 0; font-size: var(--fs-l); font-weight: normal; }
  header .tab { width: 168px; height: 56px; }
  header .tab[aria-selected="true"] { --b-face: var(--go); --b-hi: var(--go-hi); --b-cor: var(--go-cor); --b-edge: var(--go-edge); --b-lo: var(--go-lo); --b-rim: var(--go-rim); --ink: var(--on-accent); }
  header .grow { flex: 1; }
  header .shut { width: 56px; height: 56px; min-width: 56px; padding: 0 0 4px; }
  section.card { position: absolute; left: 32px; right: 32px; top: 112px; bottom: 72px; margin: 0; padding: 24px 28px; }
  h2 { margin: 0 0 16px; font-size: var(--fs); font-weight: normal; color: var(--muted); }
  .row { display: flex; align-items: center; gap: 16px; margin: 0 0 20px; }
  .row button { height: 64px; min-width: 140px; font-size: var(--fs); }
  .big { min-width: 220px !important; }
  progress { -webkit-appearance: none; appearance: none; width: 760px; height: 28px; border: 4px solid var(--deep); background: var(--sunk); }
  progress::-webkit-progress-bar { background: var(--sunk); }
  progress::-webkit-progress-value { background: var(--accent); }
  .time { color: var(--muted); }
  .time b { color: var(--fg); font-weight: normal; }
  .badge { display: inline-block; padding: 4px 12px; border: 4px solid var(--deep); background: var(--chip); color: var(--muted); }
  .badge.on { background: var(--go); color: var(--on-accent); }
  input[type=range] { -webkit-appearance: none; appearance: none; width: 520px; height: 44px; background: transparent; margin: 0; }
  input[type=range]::-webkit-slider-runnable-track { height: 12px; background: var(--sunk); border: 4px solid var(--deep); }
  input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 28px; height: 40px; margin-top: -18px; background: var(--btn); border: 4px solid var(--deep); }
  input[type=range]:focus-visible { outline: 4px solid var(--focus); outline-offset: 2px; }
  input[type=text] { width: 900px; height: 64px; font-size: var(--fs); }
  input[type=text]:focus-visible { outline: 4px solid var(--focus); outline-offset: 2px; }
  label.name { width: 160px; color: var(--muted); }
  .steps { display: flex; gap: 12px; flex-wrap: wrap; }
  .note { color: var(--muted); font-size: var(--fs-s); margin: 8px 0 0; }
  footer { position: absolute; left: 32px; right: 32px; bottom: 20px; height: 40px; display: flex; gap: 28px; align-items: center; color: var(--muted); font-size: var(--fs-s); }
  footer kbd { font: inherit; color: var(--fg); background: var(--chip); border: 2px solid var(--deep); padding: 2px 8px; }
</style>
</head>
<body data-geoui-design="1280x720" data-geoui-start="now">
  <header>
    <h1>Spectral</h1>
    <nav data-geoui-group="tabs" role="tablist" style="display:flex; gap:12px">
      <button class="tab" role="tab" aria-selected="true" aria-controls="now" data-geoui-slot="1">いま</button>
      <button class="tab" role="tab" aria-selected="false" aria-controls="net" data-geoui-slot="2">つなぐ</button>
    </nav>
    <span class="grow"></span>
    <button class="shut" data-geoui-action="close" aria-label="閉じる">✕</button>
  </header>

  <section class="card" data-geoui-page="now">
    <h2>流している曲</h2>
    <div class="row">
      <progress max="100" value="35" data-geoui-gauge="pos"></progress>
      <span class="time"><b data-geoui-value="sec" data-geoui-digits="3">042</b> 秒 / <b data-geoui-value="len" data-geoui-digits="3">180</b> 秒</span>
    </div>
    <div class="row">
      <span class="badge on" data-geoui-show="playing">▶ 流れている</span>
      <span class="badge" data-geoui-show="paused">⏸ 止めている</span>
    </div>
    <div class="row">
      <button data-geoui-action="cmd:scriptevent spectral:remote seek 0">⏮ 頭へ</button>
      <button data-geoui-action="cmd:scriptevent spectral:remote back 10">−10 秒</button>
      <button class="primary big" data-geoui-action="cmd:scriptevent spectral:remote pause">⏯ 一時停止</button>
      <button data-geoui-action="cmd:scriptevent spectral:remote fwd 10">+10 秒</button>
      <button class="danger" data-geoui-action="cmd:scriptevent spectral:remote stop">⏹ 止める</button>
    </div>
    <div class="row"><label class="name">音の大きさ</label>
      <input type="range" min="0" max="200" step="20" value="100" id="vol" data-geoui-action="cmd:scriptevent spectral:remote volume {value}">
    </div>
    <div class="row"><label class="name">内蔵の曲</label>
      <button data-geoui-action="cmd:scriptevent spectral:remote play piano_demo">ピアノ（サンプラー）</button>
      <button data-geoui-action="cmd:scriptevent spectral:remote play piano_file">ピアノ（録音そのまま）</button>
      <button data-geoui-action="cmd:scriptevent spectral:remote play band_demo">バンド</button>
    </div>
  </section>

  <section class="card" data-geoui-page="net">
    <h2>Spectral Connect（パソコンで tools/connect/server.mjs、ゲームで /connect）</h2>
    <div class="row"><span class="badge on" data-geoui-show="ws">● つながっている</span></div>
    <div class="row"><input type="text" id="url" placeholder="URL か ファイル（/sr:t &quot;&lt;URL&gt;&quot; で入れる）"></div>
    <div class="row">
      <button class="primary big" id="go" data-geoui-action="mail:play">曲にして流す</button>
      <button id="speaker" data-geoui-action="mail:speaker">スピーカーで</button>
    </div>
    <div class="row steps">
      <span class="badge on" data-geoui-show="st_dl">取り込み</span>
      <span class="badge on" data-geoui-show="st_conv">曲にする</span>
      <span class="badge on" data-geoui-show="st_send">送る</span>
      <span class="badge on" data-geoui-show="st_play">流している</span>
      <span class="badge" data-geoui-show="st_fail">だめでした</span>
    </div>
    <div class="row"><progress max="100" value="60" data-geoui-gauge="sent"></progress></div>
    <p class="note">URL は権利のあるもの（自分の・CC ライセンス）だけ。曲は Spectral Player が鳴らします。</p>
  </section>

  <footer>
    <span><kbd>WASD</kbd> えらぶ</span><span><kbd>ジャンプ</kbd> 押す</span><span><kbd>スニーク</kbd> 戻る</span><span><kbd>視点</kbd> ポインタ</span><span><kbd>1</kbd> <kbd>2</kbd> タブ</span>
  </footer>
</body>
</html>
