<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><title>タブ</title>
<style>body{margin:0;font-family:system-ui,'Noto Sans CJK JP',sans-serif;padding:40px;display:flex;flex-direction:column;gap:20px;align-items:flex-start;font-size:20px}

<body>
<a href="color.html?c=00ff00" target="_blank">新しいタブで開く（target=_blank）</a>
<button id="pop">window.open で開く</button>
<button id="al">alert を出す</button>
<script>
document.getElementById('pop').addEventListener('click', () => window.open('color.html?c=0000ff'));
document.getElementById('al').addEventListener('click', () => alert('こんにちは（alert）'));
</script></body></html>
