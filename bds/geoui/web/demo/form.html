<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><title>入力フォーム</title>
<style>body{margin:0;font-family:system-ui,'Noto Sans CJK JP',sans-serif;background:#fff;color:#202124;display:flex;gap:32px;padding:28px}
form{display:grid;grid-template-columns:auto 1fr;gap:14px 16px;align-items:center;font-size:18px;flex:1}
input[type=text],input[type=password],select,textarea{font-size:18px;padding:8px 12px;border:1px solid #dadce0;border-radius:8px}input:focus,textarea:focus,select:focus{outline:2px solid #1a73e8}
input[type=checkbox],input[type=radio]{width:22px;height:22px}button{grid-column:2;justify-self:start;font-size:18px;padding:10px 28px;border:0;border-radius:20px;background:#1a73e8;color:#fff;cursor:pointer}
#out{flex:1;background:#f1f3f4;border-radius:12px;padding:16px;font:16px ui-monospace,monospace;white-space:pre-wrap}</style></head>
<body>
<form id="f">
<label for="name">名前</label><input type="text" id="name" name="name" autocomplete="off">
<label for="pw">合言葉</label><input type="password" id="pw" name="pw">
<span>好きな物</span><span><label><input type="checkbox" name="like" value="dia"> ダイヤ</label> <label><input type="checkbox" name="like" value="em"> エメラルド</label></span>
<span>モード</span><span><label><input type="radio" name="mode" value="s" checked> サバイバル</label> <label><input type="radio" name="mode" value="c"> クリエイティブ</label></span>
<label for="biome">バイオーム</label><select id="biome" name="biome"><option>平原</option><option>砂漠</option><option>森</option><option>雪原</option></select>
<label for="memo">メモ</label><textarea id="memo" name="memo" rows="3"></textarea>
<button>送信</button>
</form>
<div id="out">（送信するとここに出ます）</div>
<script>
document.getElementById('f').addEventListener('submit', (e) => { e.preventDefault(); const d = new FormData(e.target); const o = {}; for (const [k, v] of d) o[k] = o[k] ? [].concat(o[k], v) : v; delete o.pw; o.pwLength = String(d.get('pw') || '').length; document.getElementById('out').textContent = '送信しました:\n' + JSON.stringify(o, null, 2); });
</script></body></html>
