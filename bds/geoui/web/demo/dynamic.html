<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><title>動くページ</title>
<style>body{margin:0;font-family:system-ui,'Noto Sans CJK JP',sans-serif;background:#101418;color:#e8eaed;display:grid;grid-template-columns:1fr 1fr;gap:20px;padding:24px;height:100vh;box-sizing:border-box}
section{background:#1c2128;border-radius:16px;padding:20px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px}
#clock{font:600 64px ui-monospace,monospace}#count{font:600 72px system-ui}button{font-size:22px;padding:10px 26px;border-radius:24px;border:0;background:#8ab4f8;color:#101418;cursor:pointer}
canvas{background:#0b0e11;border-radius:12px;width:100%;max-width:420px}h2{margin:0;font-size:18px;color:#9aa0a6;font-weight:500}#feed{list-style:none;margin:0;padding:0;width:100%;font-size:16px}#feed li{padding:6px 0;border-bottom:1px solid #2d333b}</style></head>
<body>
<section><h2>時計（毎秒）</h2><div id="clock">--:--:--</div></section>
<section><h2>カウンター</h2><div id="count">0</div><button id="inc">+1</button></section>
<section><h2>アニメーション</h2><canvas id="cv" width="420" height="220"></canvas></section>
<section><h2>流れてくる行（3 秒ごと）</h2><ul id="feed"></ul></section>
<script>
const pad = (n) => String(n).padStart(2, '0');
setInterval(() => { const d = new Date(); document.getElementById('clock').textContent = `${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`; }, 250);
let n = 0; document.getElementById('inc').addEventListener('click', () => { document.getElementById('count').textContent = ++n; });
const cv = document.getElementById('cv'), g = cv.getContext('2d');
(function draw(t) { g.clearRect(0, 0, cv.width, cv.height); for (let i = 0; i < 6; i++) { const x = 210 + Math.cos(t / 700 + i) * 150, y = 110 + Math.sin(t / 500 + i * 2) * 80; g.fillStyle = `hsl(${(i * 60 + t / 20) % 360} 90% 60%)`; g.beginPath(); g.arc(x, y, 16, 0, 7); g.fill(); } requestAnimationFrame(draw); })(0);
let k = 0; setInterval(() => { const li = document.createElement('li'); li.textContent = `新しい行 #${++k}（${new Date().toLocaleTimeString('ja-JP')}）`; const f = document.getElementById('feed'); f.prepend(li); while (f.children.length > 6) f.lastChild.remove(); }, 3000);
</script></body></html>
