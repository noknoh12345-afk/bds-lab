<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>GeoUI HTML Demo</title>
<!-- The sample page of bds/geoui/html: a game menu as an HTML page, made into a GeoUI by node bds/geoui/html/convert.mjs.
     Every look is the page's own CSS (normal, :hover, :focus-visible, :active, checked, disabled); the data-geoui-* attributes
     say what a control does in the game (bds/geoui/SPEC.md 「HTML から GeoUI へ」). The letters: the lab's pixel fonts (SIL OFL). -->
<link rel="stylesheet" href="../../../../panel/fonts/fonts.css">
<style>
  :root { --ink: #f4f1e8; --dim: #a9a49a; --panel: #23262e; --edge: #0d0f13; --green: #3c8527; --green-hi: #52a535; --green-lo: #2a641c; --gold: #ffd94a; }
  * { box-sizing: border-box; }
  html, body { margin: 0; width: 1280px; height: 720px; overflow: hidden; }
  body { background: #14171d; color: var(--ink); font-family: "Ore Pixel", "Ore Unifont JP", "Ore Unifont", monospace; font-size: 24px; line-height: 1.2; }
  header { position: absolute; left: 40px; right: 40px; top: 28px; height: 64px; display: flex; align-items: center; justify-content: space-between;
    background: var(--panel); border: 4px solid var(--edge); box-shadow: inset 0 -4px 0 #1a1c22; padding: 0 20px; }
  header h1 { margin: 0; font-size: 32px; font-weight: normal; letter-spacing: 1px; }
  .score { display: flex; align-items: center; gap: 12px; color: var(--dim); }
  .score b { color: var(--gold); font-weight: normal; font-variant-numeric: tabular-nums; min-width: 6ch; text-align: right; }
  nav { position: absolute; left: 40px; top: 108px; display: flex; gap: 12px; }
  .tab { width: 200px; height: 52px; font: inherit; color: var(--dim); background: #2b2f38; border: 4px solid var(--edge); box-shadow: inset 0 -4px 0 #1d2027; cursor: pointer; }
  .tab:hover { color: var(--ink); background: #343946; }
  .tab:focus-visible { outline: 4px solid var(--gold); outline-offset: 2px; }
  .tab[aria-selected="true"] { color: var(--ink); background: var(--green); box-shadow: inset 0 -4px 0 var(--green-lo), inset 0 4px 0 var(--green-hi); }
  .tab:active { transform: translateY(2px); box-shadow: none; }
  section { position: absolute; left: 40px; right: 40px; top: 180px; bottom: 96px; background: var(--panel); border: 4px solid var(--edge); padding: 28px; }
  h2 { margin: 0 0 20px; font-size: 26px; font-weight: normal; color: var(--dim); }
  .grid { display: grid; grid-template-columns: repeat(3, 240px); gap: 16px; }
  .btn { height: 64px; font: inherit; color: var(--ink); background: #3a3f4b; border: 4px solid var(--edge); box-shadow: inset 0 -6px 0 #2a2e37, inset 0 4px 0 #4b515f; cursor: pointer; }
  .btn:hover { background: #474d5c; }
  .btn:focus-visible { outline: 4px solid var(--gold); outline-offset: 2px; }
  .btn:active { transform: translateY(3px); box-shadow: inset 0 -2px 0 #2a2e37; }
  .btn:disabled { color: #6c6a66; background: #2a2c31; box-shadow: none; }
  .btn.go { position: absolute; right: 28px; bottom: 28px; width: 300px; height: 80px; font-size: 32px; background: var(--green); box-shadow: inset 0 -6px 0 var(--green-lo), inset 0 4px 0 var(--green-hi); }
  .btn.go:hover { background: var(--green-hi); }
  .row { display: flex; align-items: center; gap: 20px; margin: 0 0 22px; }
  .row label.name { width: 260px; color: var(--dim); }
  .toggle { width: 96px; height: 44px; font: inherit; font-size: 20px; color: var(--dim); background: #2b2f38; border: 4px solid var(--edge); cursor: pointer; }
  .toggle[aria-checked="true"] { color: var(--ink); background: var(--green); }
  .toggle::after { content: "OFF"; }
  .toggle[aria-checked="true"]::after { content: "ON"; }
  .toggle:hover { filter: brightness(1.15); }
  .toggle:focus-visible, .radio:focus-visible { outline: 4px solid var(--gold); outline-offset: 2px; }
  .radio { width: 150px; height: 44px; font: inherit; font-size: 20px; color: var(--dim); background: #2b2f38; border: 4px solid var(--edge); cursor: pointer; }
  .radio[aria-checked="true"] { color: #14171d; background: var(--gold); }
  .radio:hover { filter: brightness(1.15); }
  input[type=range] { -webkit-appearance: none; appearance: none; width: 420px; height: 44px; background: transparent; margin: 0; }
  input[type=range]::-webkit-slider-runnable-track { height: 12px; background: #3a3f4b; border: 4px solid var(--edge); }
  input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 28px; height: 40px; margin-top: -18px; background: var(--ink); border: 4px solid var(--edge); }
  input[type=range]:focus-visible { outline: 4px solid var(--gold); outline-offset: 2px; }
  .bar { width: 420px; height: 28px; }
  progress { -webkit-appearance: none; appearance: none; width: 420px; height: 28px; border: 4px solid var(--edge); background: #2b2f38; }
  progress::-webkit-progress-bar { background: #2b2f38; }
  progress::-webkit-progress-value { background: var(--gold); }
  .slots { display: grid; grid-template-columns: repeat(9, 96px); gap: 10px; }
  .slot { height: 96px; font: inherit; font-size: 20px; color: var(--ink); background: #2b2f38; border: 4px solid var(--edge); box-shadow: inset 4px 4px 0 #1d2027; cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; }
  .slot i { width: 40px; height: 40px; display: block; font-style: normal; }
  .slot:hover { background: #343946; }
  .slot:focus-visible { outline: 4px solid var(--gold); outline-offset: -4px; }
  .slot:active { background: #1d2027; }
  .note { margin-top: 26px; color: var(--dim); font-size: 20px; }
  footer { position: absolute; left: 40px; right: 40px; bottom: 28px; height: 52px; display: flex; align-items: center; gap: 28px; color: var(--dim); font-size: 20px; }
  footer kbd { font: inherit; color: var(--ink); background: #2b2f38; border: 2px solid var(--edge); padding: 2px 8px; }
  .gem { background: linear-gradient(#7fe3ff, #2a8fbf); clip-path: polygon(50% 0, 100% 40%, 50% 100%, 0 40%); }
  .apple { background: radial-gradient(circle at 40% 40%, #ff7b6b, #c21f1f); border-radius: 50%; }
  .pick { background: linear-gradient(135deg, transparent 42%, #8a5a2b 42%, #8a5a2b 58%, transparent 58%), linear-gradient(45deg, transparent 30%, #9fb4c4 30%, #9fb4c4 70%, transparent 70%); }
  .bread { background: #d9a441; border-radius: 30% 30% 20% 20%; }
  .torch { background: linear-gradient(#ffd94a 0 30%, #8a5a2b 30%); width: 14px !important; }
  .book { background: #7b3f2a; box-shadow: inset -6px 0 0 #e9e1c8; }
</style>
</head>
<body data-geoui-design="1280x720" data-geoui-start="play">
  <header>
    <h1>GEOUI ゲームメニュー</h1>
    <div class="score">SCORE <b data-geoui-value="score" data-geoui-digits="6">000000</b></div>
  </header>
  <nav data-geoui-group="tabs" role="tablist">
    <button class="tab" role="tab" aria-selected="true" aria-controls="play" data-geoui-slot="1">あそぶ</button>
    <button class="tab" role="tab" aria-selected="false" aria-controls="items" data-geoui-slot="2">もちもの</button>
    <button class="tab" role="tab" aria-selected="false" aria-controls="settings" data-geoui-slot="3">せってい</button>
  </nav>

  <section data-geoui-page="play">
    <h2>ステージをえらぶ</h2>
    <div class="grid" data-geoui-group="stages">
      <button class="btn" data-geoui-action="event:stage1">1. 草原</button>
      <button class="btn" data-geoui-action="event:stage2">2. 洞くつ</button>
      <button class="btn" data-geoui-action="event:stage3">3. ネザー</button>
      <button class="btn" data-geoui-action="event:stage4">4. 海の底</button>
      <button class="btn" data-geoui-action="event:stage5">5. 空の島</button>
      <button class="btn" disabled>6. ？？？</button>
    </div>
    <button class="btn go" data-geoui-action="event:start">スタート</button>
  </section>

  <section data-geoui-page="items">
    <h2>もちもの（ホイール・1〜9 キーでスロット）</h2>
    <div class="slots" data-geoui-group="slots">
      <button class="slot" data-geoui-slot="1" data-geoui-action="event:item1"><i class="gem"></i>×3</button>
      <button class="slot" data-geoui-slot="2" data-geoui-action="event:item2"><i class="apple"></i>×12</button>
      <button class="slot" data-geoui-slot="3" data-geoui-action="event:item3"><i class="pick"></i>1</button>
      <button class="slot" data-geoui-slot="4" data-geoui-action="event:item4"><i class="bread"></i>×5</button>
      <button class="slot" data-geoui-slot="5" data-geoui-action="event:item5"><i class="torch"></i>×64</button>
      <button class="slot" data-geoui-slot="6" data-geoui-action="event:item6"><i class="book"></i>1</button>
      <button class="slot" data-geoui-slot="7" data-geoui-action="event:item7"></button>
      <button class="slot" data-geoui-slot="8" data-geoui-action="event:item8"></button>
      <button class="slot" data-geoui-slot="9" data-geoui-action="event:item9"></button>
    </div>
    <p class="note">ジャンプで使う・スニークで戻る・視点でポインタ</p>
  </section>

  <section data-geoui-page="settings">
    <h2>せってい</h2>
    <div class="row"><label class="name">音楽</label><button class="toggle" role="switch" aria-checked="true" data-geoui-name="music"></button></div>
    <div class="row"><label class="name">効果音</label><button class="toggle" role="switch" aria-checked="false" data-geoui-name="sfx"></button></div>
    <div class="row" data-geoui-group="level"><label class="name">むずかしさ</label>
      <button class="radio" role="radio" aria-checked="false" data-geoui-radio="level">やさしい</button>
      <button class="radio" role="radio" aria-checked="true" data-geoui-radio="level">ふつう</button>
      <button class="radio" role="radio" aria-checked="false" data-geoui-radio="level">むずかしい</button>
    </div>
    <div class="row"><label class="name">かんど</label><input type="range" min="1" max="10" step="1" value="4" data-geoui-name="sens"></div>
    <div class="row"><label class="name">しんちょく</label><progress class="bar" max="100" value="60" data-geoui-gauge="progress"></progress></div>
  </section>

  <footer>
    <span><kbd>WASD</kbd> えらぶ</span><span><kbd>SPACE</kbd> 決定</span><span><kbd>SHIFT</kbd> 戻る</span><span><kbd>ホイール</kbd> スロット</span><span><kbd>視点</kbd> ポインタ</span>
  </footer>
</body>
</html>
