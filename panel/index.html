<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!-- the page talks to GitHub's API alone (and its own config.json; pages.yml adds the lab's sign-in service, its origin
     only: common/panel-config.mjs), runs only its own scripts, posts a form only to GitHub (the App's manifest), loads only
     its own fonts, and shows pictures only of its own (the pixel icons are its own data: addresses), GitHub's avatars, the live
     screen's PNG (data:) and what an artifact holds — its pictures and videos, made in the page itself from the bytes the lab's
     service passed on (blob:: ui/viewer.mjs). A token here can go nowhere else -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; font-src 'self'; img-src 'self' data: blob: https://avatars.githubusercontent.com; media-src blob:; connect-src 'self' https://api.github.com; base-uri 'none'; form-action https://github.com; manifest-src 'self'">
<meta name="referrer" content="no-referrer">
<meta name="color-scheme" content="dark">
<title>bds-lab 管理パネル</title>
<script src="early.js"></script>
<link rel="preload" href="fonts/pixel/pixel-regular.otf" as="font" type="font/otf" crossorigin>
<link rel="stylesheet" href="fonts/fonts.css">
<link rel="stylesheet" href="icons.css">
<link rel="stylesheet" href="styles.css">
<link rel="stylesheet" href="panel.css">
<link rel="stylesheet" href="a11y.css">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<meta name="theme-color" content="#e6e8eb">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="bds-lab">
<script type="module" src="panel.js"></script>
</head>
<body>
<header id="top"><div class="nstart" id="nstart"></div><h1 id="title">bds-lab<span class="h1sub"> 管理パネル</span></h1><div id="who"></div></header>
<main id="main"><p class="muted boot ore-wait" role="status"></p></main>
<div id="toast" role="status" aria-live="polite"></div>
<noscript><p>このパネルは JavaScript で動きます。</p><p lang="en">This panel needs JavaScript.</p></noscript>
</body>
</html>
